<svg fill="#F8FAFC" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 鹈鹕骑行：图标栏 Type-1 线稿剪影（自行车 + 车座上的鹈鹕，大喙指向前进方向；
       白剪影透明底，图标栏单色滤镜强制着色，界面 img 显示用） -->
  <g fill="none" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 车轮 -->
    <circle cx="5.8" cy="17.4" r="3.4"/>
    <circle cx="18.4" cy="17.4" r="3.4"/>
    <!-- 车架：后轮毂→五通→座管 / 上管→前轮毂→前叉 -->
    <path d="M5.8 17.4 10.6 16.6 8.2 10"/>
    <path d="M8.2 10 14.8 10.2 18.4 17.4"/>
    <path d="M10.6 16.6 14.8 10.2"/>
    <path d="M14.8 10.2 14.4 8.4 16.4 8.1"/>
    <!-- 曲柄与踏板 -->
    <path d="M9.2 18.6 12 14.6"/>
    <!-- 鹈鹕尾巴 -->
    <path d="M5.6 5.9 4 5"/>
    <!-- 脖颈 -->
    <path d="M10.2 5.9Q11.6 4.5 12.9 5" stroke-width="1.4"/>
    <!-- 喉囊 -->
    <path d="M14.8 6.9Q16.3 8.8 18.6 6.5" stroke-width="1.1"/>
  </g>
  <!-- 车座上的鹈鹕：身体 / 头 / 大喙 -->
  <ellipse cx="8" cy="6.7" rx="2.8" ry="2"/>
  <circle cx="13.3" cy="5" r="1.5"/>
  <circle cx="13.7" cy="4.5" r="0.4"/>
  <path d="M14.7 4.6 19.8 6.1 14.9 7.3Z"/>
  <!-- 五通轴心 -->
  <circle cx="10.6" cy="16.6" r="1.1"/>
</svg>
